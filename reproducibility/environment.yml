name: mri-algo
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=2.2.6
  - pandas=2.3.3
  - scipy=1.15.3
  - scikit-learn=1.7.2
  - matplotlib=3.10.9
  - pillow=11.3.0
  # CPU build shown here for portability. Training runs need a CUDA build
  # matching the training host's driver — see README.md "Hardware" section
  # — e.g. swap for: pytorch-cuda=12.1 pytorch torchvision -c pytorch -c nvidia
  - pytorch=2.12.1
  - torchvision=0.27.1
  - cpuonly
  - pip:
      - ImageHash==4.3.2
      - opencv-python==4.13.0.92
      - seaborn>=0.13
