# Conda environment for the brain MRI triage project.
#
# 2026-07-31, session E: the previous version of this file could not have
# worked. It asked conda for `pytorch=2.12.1` and `torchvision=0.27.1` from
# the `pytorch` channel. That channel stopped publishing; its newest build is
# 2.5.1, last touched March 2025. `conda env create` against the old file
# would fail at the solve step.
#
# PyTorch's own current guidance is to install torch via pip. So torch,
# torchvision and every other exact pin go through the pip section below, and
# conda supplies only the interpreter.
#
# The pip path (`pip install -r reproducibility/requirements.txt`) is the
# verified one: resolved cleanly against PyPI on 2026-07-31, Python 3.10.11,
# Windows 11. This conda file has NOT been verified end to end, because conda
# is not installed on the machine this project was built on. See
# reproducibility/README.md, "What is verified and what is not".

name: mri-algo
channels:
  - conda-forge
dependencies:
  - python=3.10.11
  - pip
  - pip:
      - -r requirements.txt

# CUDA note. The pins in requirements.txt are the CPU builds the reported run
# actually used. Training on GPU needs a CUDA build matching your driver.
# Replace the torch and torchvision lines with the index URL for your CUDA
# version from https://pytorch.org/get-started/locally/, for example:
#
#     pip install torch==2.12.1 torchvision==0.27.1 \
#         --index-url https://download.pytorch.org/whl/cu121
#
# Results will not be bit-identical between CPU and CUDA builds even with the
# seeds fixed. Expect differences in the third decimal place.
